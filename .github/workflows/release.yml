name: Release plugin artifacts

on:
  push:
    tags:
      - "v*"
      - "candidate/v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@11.6.0
      - name: Require the signed package-version tag
        env:
          PARLEY_RELEASE_SIGNER_PUBLIC_KEY: ${{ vars.PARLEY_RELEASE_SIGNER_PUBLIC_KEY }}
          PARLEY_RELEASE_SIGNER_FINGERPRINT: ${{ vars.PARLEY_RELEASE_SIGNER_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync("package.json", "utf8")).version)')"
          case "${tag}" in
            "candidate/v${version}") release_mode="candidate" ;;
            "v${version}") release_mode="publish" ;;
            *)
              echo "Tag must be candidate/v${version} or v${version}."
              exit 1
              ;;
          esac
          git cat-file -e "${tag}^{tag}"
          test -n "${PARLEY_RELEASE_SIGNER_PUBLIC_KEY}"
          test -n "${PARLEY_RELEASE_SIGNER_FINGERPRINT}"
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "${GNUPGHOME}"' EXIT
          chmod 700 "${GNUPGHOME}"
          printf '%s\n' "${PARLEY_RELEASE_SIGNER_PUBLIC_KEY}" | gpg --batch --homedir "${GNUPGHOME}" --import >/dev/null
          secret_key_records="$(gpg --batch --homedir "${GNUPGHOME}" --with-colons --list-secret-keys)"
          if printf '%s\n' "${secret_key_records}" | awk -F: '$1 == "sec" || $1 == "ssb" { found = 1 } END { exit(found ? 0 : 1) }'; then
            echo "Configured signer public key must not contain private-key material."
            exit 1
          fi
          expected_fingerprint="$(printf '%s' "${PARLEY_RELEASE_SIGNER_FINGERPRINT}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          if ! [[ "${expected_fingerprint}" =~ ^([A-F0-9]{40}|[A-F0-9]{64})$ ]]; then
            echo "Configured signer fingerprint must be a 40- or 64-character hexadecimal fingerprint."
            exit 1
          fi
          actual_fingerprints="$(gpg --batch --homedir "${GNUPGHOME}" --with-colons --fingerprint --list-keys | awk -F: '$1 == "pub" { primary = 1; next } primary && $1 == "fpr" { print toupper($10); primary = 0 }')"
          actual_fingerprint_count="$(printf '%s\n' "${actual_fingerprints}" | sed '/^$/d' | wc -l | tr -d '[:space:]')"
          test "${actual_fingerprint_count}" = "1"
          actual_fingerprint="${actual_fingerprints}"
          test -n "${actual_fingerprint}"
          test "${expected_fingerprint}" = "${actual_fingerprint}"
          git verify-tag "${tag}" >/dev/null 2>&1
          if [ "${release_mode}" = "publish" ]; then
            candidate_tag="candidate/v${version}"
            git cat-file -e "${candidate_tag}^{tag}"
            git verify-tag "${candidate_tag}" >/dev/null 2>&1
            candidate_commit="$(git rev-parse "${candidate_tag}^{commit}")"
            release_commit="$(git rev-parse "${tag}^{commit}")"
            if [ "${candidate_commit}" != "${release_commit}" ]; then
              echo "Final release tag must point to the certified candidate commit."
              exit 1
            fi
          fi
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check -r tools/codex-plugin-validator/requirements.txt
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate
      - run: pnpm scan-secrets
      - run: pnpm prepare-release
      - name: Retain candidate artifacts in an unpublished draft
        if: startsWith(github.ref, 'refs/tags/candidate/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: gh release create "${GITHUB_REF_NAME}" release/* --draft --verify-tag --title "Parley plugin ${GITHUB_REF_NAME}"
      - name: Publish the exact candidate artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_tag="candidate/${GITHUB_REF_NAME}"
          test "$(gh release view "${candidate_tag}" --json isDraft --jq '.isDraft')" = "true"
          candidate_dir="$(mktemp -d)"
          trap 'rm -rf "${candidate_dir}"' EXIT
          gh release download "${candidate_tag}" --dir "${candidate_dir}"
          diff --brief --recursive --no-dereference release "${candidate_dir}"
          gh release create "${GITHUB_REF_NAME}" "${candidate_dir}"/* --verify-tag
