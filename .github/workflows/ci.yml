name: Validate plugin artifacts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: corepack prepare pnpm@11.6.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --disable-pip-version-check -r tools/codex-plugin-validator/requirements.txt
      - run: pnpm test
      - run: pnpm build
      - run: pnpm validate
      - run: pnpm scan-secrets
